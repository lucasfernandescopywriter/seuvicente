<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Fundo suave de alerta acústico -->
  <circle cx="100" cy="100" r="88" fill="#FEF2F2" opacity="0.7"/>
  
  <!-- Círculos concêntricos de calibração desfocados / dispersos (Estilo cirúrgico harmonizado) -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="100" cy="100" r="56" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="3,3"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#475569" stroke-width="2"/>
  <circle cx="100" cy="100" r="22" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
  
  <!-- Centro sem foco: onda de ruído e choque em vermelho que foge do alvo -->
  <circle cx="100" cy="100" r="8" fill="#EF4444" stroke="#7F1D1D" stroke-width="2"/>
  
  <!-- Eixos de mira fragmentados / desalinhados -->
  <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="14" x2="100" y2="28" stroke-dasharray="2,2"/>
    <line x1="100" y1="172" x2="100" y2="186" stroke-dasharray="2,2"/>
    <line x1="14" y1="100" x2="28" y2="100" stroke-dasharray="2,2"/>
    <line x1="172" y1="100" x2="186" y2="100" stroke-dasharray="2,2"/>
  </g>

  <!-- Ondas elétricas caóticas cruzando o alvo (Estática / Chiado disperso) -->
  <path d="M 38 100 
           L 50 88 L 62 112 L 74 82 L 86 118 L 98 84 L 110 116 L 122 80 L 134 120 L 146 88 L 158 112 L 166 100" 
        fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Símbolo de erro / dispersão (X sutil indicando mira errada) -->
  <g transform="translate(150, 42)">
    <circle cx="0" cy="0" r="13" fill="#DC2626"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
